name: ojay_and_mae_invitation
description: "Undangan Pernikahan Ojay & Mae (19.12.2026)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.5

  flutter_web_plugins:
    sdk: flutter
  # material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: AngelRhapsody
      fonts:
        - asset: assets/fonts/Angel rhapsody.ttf
    - family: AngelWish
      fonts:
        - asset: assets/fonts/Angel wish.ttf
    - family: BirdsOfParadise
      fonts:
        - asset: assets/fonts/Birds of Paradise.ttf
